<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>San Valentín 💖</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: url("foto.jpg") no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      padding: 35px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
      width: 350px;
      position: relative;
    }

    h1 {
      color: #e91e63;
      font-size: 30px;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      margin: 10px;
    }

    #si {
      background: #e91e63;
      color: white;
    }

    #no {
      background: #aaa;
      color: white;
      position: absolute;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1 id="texto">Mi camote 💖<br>¿quieres ser mi San Valentín?</h1>

    <button id="si" onclick="reproducir()">Sí 💘</button>
    <button id="no" onmouseover="mover()">No 😢</button>
  </div>

  <audio id="musica">
    <source src="locos.mp3" type="audio/mpeg">
  </audio>

  <script>
    function reproducir() {
      document.getElementById("texto").innerHTML = "Yeii te amoo 💗";
      document.getElementById("musica").play();
    }

    function mover() {
      const no = document.getElementById("no");
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      no.style.transform = `translate(${x}px, ${y}px)`;
    }
  </script>

</body>
</html>
